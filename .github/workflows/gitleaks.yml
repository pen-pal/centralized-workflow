name: Secret Scan (gitleaks)

on:
  workflow_call:
    inputs:
      full_history:
        description: 'Scan every commit in the history; false scans only the checked-out files'
        required: false
        default: true
        type: boolean
      sarif:
        description: 'Upload findings to code scanning (needs GitHub Advanced Security on private repos)'
        required: false
        default: true
        type: boolean

permissions: {}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # SARIF upload, used only when sarif is true
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.full_history && '0' || '1' }}

      # ponytail: release binary pinned by checksum; Dependabot cannot bump it, update by hand.
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Picks up the caller's .gitleaks.toml and .gitleaksignore. Findings are redacted in logs.
      - name: Scan
        env:
          MODE: ${{ inputs.full_history && 'git' || 'dir' }}
        run: gitleaks "$MODE" --redact --no-banner --report-format sarif --report-path gitleaks.sarif .

      - name: Upload SARIF
        if: always() && inputs.sarif && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
