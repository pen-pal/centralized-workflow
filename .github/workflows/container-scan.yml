name: Container Image Scans

on:
  workflow_call:
    inputs:
      sha:
        description: 'Image tag to scan. Ignored when digest is set'
        required: true
        type: string
      digest:
        description: 'Manifest list digest to scan instead of the sha tag, e.g. build.yml output digest'
        required: false
        default: ''
        type: string
      archs:
        description: 'Architectures to scan (JSON array). sbom and scout run on amd64 only'
        required: false
        default: '["amd64", "arm64"]'
        type: string
      branch_slug:
        description: 'Unused. Kept so existing callers that pass it do not break'
        required: false
        type: string
      repo_name:
        description: 'Image name under ghcr.io/<owner>/'
        required: true
        type: string
      tools:
        description: 'Scanners to run (JSON array). Add "scout" only with DOCKER_USER / DOCKER_PAT set'
        required: false
        default: '["anchore", "sbom", "trivy"]'
        type: string
      fail_severity:
        description: 'Trivy fails the scan on fixable findings of these severities. Empty disables the gate'
        required: false
        default: 'CRITICAL,HIGH'
        type: string
      sarif:
        description: 'Also save Trivy findings as sarif-trivy-image-<arch> artifacts, for sarif-upload.yml'
        required: false
        default: false
        type: boolean
    outputs:
      anchore_scan_duration:
        description: 'Seconds taken by the anchore scan'
        value: ${{ jobs.scan.outputs.anchore }}
      anchore_sbom_scan_duration:
        description: 'Seconds taken by the sbom scan'
        value: ${{ jobs.scan.outputs.sbom }}
      trivy_scan_duration:
        description: 'Seconds taken by the trivy scan'
        value: ${{ jobs.scan.outputs.trivy }}
      docker_scout_scan_duration:
        description: 'Seconds taken by the scout scan'
        value: ${{ jobs.scan.outputs.scout }}
    secrets:
      GH_ACTION_PAT:
        description: 'PAT for GHCR / private deps. Falls back to GITHUB_TOKEN'
        required: false
      GH_ACTION_ACTOR:
        description: 'User for GH_ACTION_PAT. Falls back to github.actor'
        required: false
      DOCKER_USER:
        description: 'Docker Hub user, needed for the scout tool'
        required: false
      DOCKER_PAT:
        description: 'Docker Hub token, needed for the scout tool'
        required: false

env:
  REPO: ${{ inputs.repo_name }}
  ORG: ${{ github.repository_owner }}
  SHA: ${{ inputs.sha }}

jobs:
  scan:
    name: Container Scans
    outputs:
      # each matrix leg sets only its own tool's output
      anchore: ${{ steps.set-duration.outputs.anchore }}
      sbom: ${{ steps.set-duration.outputs.sbom }}
      trivy: ${{ steps.set-duration.outputs.trivy }}
      scout: ${{ steps.set-duration.outputs.scout }}
    runs-on: ubuntu-latest # scanners read the image; no need to run on the target arch
    timeout-minutes: 30

    strategy:
      matrix:
        arch: ${{ fromJSON(inputs.archs) }}
        tool: ${{ fromJSON(inputs.tools) }}
        exclude: # one SBOM artifact and one Scout PR comment per image
          - { tool: sbom, arch: arm64 }
          - { tool: scout, arch: arm64 }
      fail-fast: false

    permissions:
      packages: read
      pull-requests: write # scout PR comment

    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Start timer
        id: start-time
        run: echo "start_time=$(date +%s)" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GH_ACTION_ACTOR || github.actor }}
          password: ${{ secrets.GH_ACTION_PAT || github.token }}

      - name: Resolve and pull the ${{ matrix.arch }} image
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ inputs.digest }}
        run: |
          base="ghcr.io/$ORG/$REPO"
          src="${base}:${SHA}"
          if [ -n "$DIGEST" ]; then src="${base}@${DIGEST}"; fi
          # Pin this arch's own manifest digest, so every scanner sees exactly that image.
          digest=$(docker buildx imagetools inspect --raw "$src" \
            | jq -er --arg a "$ARCH" '[.manifests[]? | select(.platform.os == "linux" and .platform.architecture == $a) | .digest][0]') \
            || { echo "::error::no linux/$ARCH image in $src"; exit 1; }
          echo "IMAGE=${base}@${digest}" >> "$GITHUB_ENV"
          echo "🔎 $src (linux/$ARCH) -> ${base}@${digest}"
          docker pull "${base}@${digest}"

      - name: Run Anchore Scan
        if: ${{ matrix.tool == 'anchore' }}
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}
          fail-build: false

      - name: Run SBOM Scan
        if: ${{ matrix.tool == 'sbom' }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}

      # Before the gate, so the report exists even when the gate fails.
      - name: Trivy SARIF report
        if: ${{ matrix.tool == 'trivy' && inputs.sarif }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true
          exit-code: '0'

      - name: Save SARIF report
        if: ${{ matrix.tool == 'trivy' && inputs.sarif }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-trivy-image-${{ matrix.arch }}
          path: trivy-image.sarif
          retention-days: 1 # only sarif-upload.yml reads it

      - name: Run Trivy Scan
        if: ${{ matrix.tool == 'trivy' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          skip-setup-trivy: ${{ inputs.sarif }}
          format: table
          ignore-unfixed: true
          severity: ${{ inputs.fail_severity || 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL' }}
          exit-code: ${{ inputs.fail_severity != '' && '1' || '0' }}

      - name: Log into Docker Registry (for Scout)
        if: ${{ matrix.tool == 'scout' }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Run Docker Scout
        if: ${{ matrix.tool == 'scout' }}
        uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1.29.0
        with:
          command: quickview,cves,recommendations
          image: ${{ env.IMAGE }}
          ignore-unchanged: true
          only-severities: critical,high
          write-comment: true
          github-token: ${{ secrets.GH_ACTION_PAT || github.token }}

      - name: End timer and calculate duration
        id: set-duration
        if: always()
        env:
          TOOL: ${{ matrix.tool }}
        run: echo "${TOOL}=$(( $(date +%s) - start_time ))" >> "$GITHUB_OUTPUT"
