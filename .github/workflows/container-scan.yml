name: Container Image Scans

on:
  workflow_call:
    inputs:
      sha:
        description: 'SHA to use as image tag'
        required: true
        type: string
      branch_slug:
        description: 'String to tag on image'
        required: true
        type: string
      repo_name:
        description: 'Name of repo'
        required: true
        type: string
      tools:
        description: 'Scanners to run (JSON array). Add "scout" only with DOCKER_USER / DOCKER_PAT set'
        required: false
        default: '["anchore", "sbom", "trivy"]'
        type: string
    outputs:
      anchore_scan_duration:
        description: 'Seconds taken by the anchore scan'
        value: ${{ jobs.scan.outputs.anchore }}
      anchore_sbom_scan_duration:
        description: 'Seconds taken by the sbom scan'
        value: ${{ jobs.scan.outputs.sbom }}
      trivy_scan_duration:
        description: 'Seconds taken by the trivy scan'
        value: ${{ jobs.scan.outputs.trivy }}
      docker_scout_scan_duration:
        description: 'Seconds taken by the scout scan'
        value: ${{ jobs.scan.outputs.scout }}
    secrets:
      GH_ACTION_PAT:
        description: 'PAT for GHCR / private deps. Falls back to GITHUB_TOKEN'
        required: false
      GH_ACTION_ACTOR:
        description: 'User for GH_ACTION_PAT. Falls back to github.actor'
        required: false
      DOCKER_USER:
        description: 'Docker Hub user, needed for the scout tool'
        required: false
      DOCKER_PAT:
        description: 'Docker Hub token, needed for the scout tool'
        required: false

env:
  REPO: ${{ inputs.repo_name }}
  ORG: ${{ github.repository_owner }}
  SHA: ${{ inputs.sha }}

jobs:
  scan:
    name: Container Scans
    outputs:
      # each matrix leg sets only its own tool's output
      anchore: ${{ steps.set-duration.outputs.anchore }}
      sbom: ${{ steps.set-duration.outputs.sbom }}
      trivy: ${{ steps.set-duration.outputs.trivy }}
      scout: ${{ steps.set-duration.outputs.scout }}
    runs-on: ubuntu-latest #[self-hosted, linux, ${{ matrix.arch }}]

    strategy:
      matrix:
        arch: [x64]
        tool: ${{ fromJSON(inputs.tools) }}
      fail-fast: false

    permissions:
      contents: read
      packages: read
      pull-requests: write # scout PR comment

    steps:
      - uses: step-security/harden-runner@v2.16.0
        with:
          egress-policy: audit

      - name: Start timer
        id: start-time
        run: echo "start_time=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v5.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GH_ACTION_ACTOR || github.actor }}
          password: ${{ secrets.GH_ACTION_PAT || github.token }}

      - name: Sanitize branch slug
        id: sanitize
        run: |
          CLEAN_BRANCH="${{ inputs.branch_slug }}"
          BRANCH="${CLEAN_BRANCH//\//-}"
          echo "CLEAN_BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Pull Docker Image
        run: |
          ARCH=${{ matrix.arch }}
          if [ "$ARCH" = "x64" ]; then
            ARCH="amd64"
          fi
          docker pull --platform linux/$ARCH ghcr.io/${{ env.ORG }}/${{ env.REPO }}:${{ env.SHA }}

      - name: Run Anchore Scan
        if: ${{ matrix.tool == 'anchore' }}
        uses: anchore/scan-action@v6.5.1
        with:
          image: ghcr.io/${{ env.ORG }}/${{ env.REPO }}:${{ env.SHA }}
          fail-build: false

      - name: Run SBOM Scan
        if: ${{ matrix.tool == 'sbom' && matrix.arch == 'x64' }}
        uses: anchore/sbom-action@v0.20.5
        with:
          image: ghcr.io/${{ env.ORG }}/${{ env.REPO }}:${{ env.SHA }}

      - name: Run Trivy Scan
        if: ${{ matrix.tool == 'trivy' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.ORG }}/${{ env.REPO }}:${{ env.SHA }}
          format: table
          ignore-unfixed: true

      - name: Log into Docker Registry (for Scout)
        if: ${{ matrix.tool == 'scout' }}
        uses: docker/login-action@v3.5.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Run Docker Scout
        if: ${{ matrix.tool == 'scout' }}
        uses: docker/scout-action@v1.18.2
        with:
          command: quickview,cves,recommendations
          image: ghcr.io/${{ env.ORG }}/${{ env.REPO }}:${{ env.SHA }}
          ignore-unchanged: true
          only-severities: critical,high
          write-comment: true
          github-token: ${{ secrets.GH_ACTION_PAT || github.token }}

      - name: Handle build failure
        if: ${{ failure() }}
        run: echo "Build failed. Check logs for details."

      - name: End timer and calculate duration
        id: set-duration
        if: always()
        env:
          TOOL: ${{ matrix.tool }}
        run: echo "${TOOL}=$(( $(date +%s) - start_time ))" >> "$GITHUB_OUTPUT"
