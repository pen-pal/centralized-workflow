name: Deploy

on:
  workflow_call:
    inputs:
      sha:
        description: 'Image tag to deploy'
        required: true
        type: string
      branch_slug:
        description: 'Branch name, used as the target folder for non-release refs (slashes become dashes)'
        required: true
        type: string
      repo_name:
        description: 'Source repo name, passed through to the deploy repo'
        required: true
        type: string
      app_name:
        description: 'App name, passed through to the deploy repo'
        required: true
        type: string
      digest:
        description: 'Image digest (build.yml output digest), passed through so the deploy repo can pin it'
        required: false
        default: ''
        type: string
    outputs:
      deploy_duration:
        description: 'Seconds taken by the deploy job'
        value: ${{ jobs.deploy.outputs.duration }}
    secrets:
      DISPATCH_PAT:
        description: 'PAT allowed to send repository_dispatch to the deploy repo'
        required: true
      DEPLOY_REPO:
        description: 'Name of the deploy (GitOps) repo under the same owner'
        required: true

permissions: {}

env:
  REPO: ${{ inputs.repo_name }}
  ORG: ${{ github.repository_owner }}
  SHA: ${{ inputs.sha }}
  APP_NAME: ${{ inputs.app_name }}

jobs:
  determine_deployment_target:
    name: Determine Target
    runs-on: ubuntu-latest # Can be a fast, standard runner
    timeout-minutes: 5
    if: github.event_name != 'pull_request'
    outputs:
      target_folder: ${{ steps.check_prod.outputs.folder || steps.check_public.outputs.folder || steps.check_fallback.outputs.folder }}
      
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Start timer
        id: start-time
        run: echo "start_time=$(date +%s)" >> "$GITHUB_ENV"

      - name: CHECK Production Tag (v*.*.*)
        id: check_prod
        if: |
          startsWith(github.ref, 'refs/tags/') &&
          startsWith(github.ref_name, 'v') &&
          !contains(github.ref_name, '-pub') &&
          !contains(github.ref_name, '-beta') &&
          !contains(github.ref_name, '-test') &&
          !contains(github.ref_name, '-dev') &&
          !contains(github.ref_name, '-rc')
        run: echo "folder=production" >> "$GITHUB_OUTPUT"

      - name: CHECK Public Tag (v*.*.*-pub or -beta)
        id: check_public
        if: |
          steps.check_prod.outcome != 'success' &&
          startsWith(github.ref, 'refs/tags/') &&
          (contains(github.ref_name, '-pub') || contains(github.ref_name, '-beta'))
        run: echo "folder=public" >> "$GITHUB_OUTPUT"

      - name: CHECK Fallback (branch or rejected tags)
        id: check_fallback
        if: |
          steps.check_prod.outcome != 'success' &&
          steps.check_public.outcome != 'success'
        env:
          BRANCH_SLUG: ${{ inputs.branch_slug }}
        run: |
          folder="${BRANCH_SLUG//\//-}"
          if [ -z "$folder" ] || [[ "$folder" == *[[:space:][:cntrl:]]* ]]; then
            echo "::error::branch_slug must be non-empty with no whitespace or control characters"
            exit 1
          fi
          echo "folder=$folder" >> "$GITHUB_OUTPUT"

      - name: End timer and calculate duration
        id: set-duration
        if: always()
        run: |
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          echo "duration=${duration}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to ${{ needs.determine_deployment_target.outputs.target_folder }}
    runs-on: ubuntu-latest # Can be a fast, standard runner
    timeout-minutes: 10
    needs: [determine_deployment_target]
    outputs:
      duration: ${{ steps.set-duration.outputs.duration }}
    if: needs.determine_deployment_target.outputs.target_folder != '' && github.event_name != 'pull_request'

    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Start timer
        id: start-time
        run: echo "start_time=$(date +%s)" >> "$GITHUB_ENV"

      - name: Trigger Image Update
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.DISPATCH_PAT }} 
          repository: ${{ github.repository_owner }}/${{ secrets.DEPLOY_REPO }}
          event-type: update-image-tag
          client-payload: >
            {
              "target_dir": ${{ toJSON(needs.determine_deployment_target.outputs.target_folder) }},
              "repo_name": ${{ toJSON(inputs.repo_name) }},
              "app_name": ${{ toJSON(inputs.app_name) }},
              "sha": ${{ toJSON(inputs.sha) }},
              "digest": ${{ toJSON(inputs.digest) }}
            }

      - name: End timer and calculate duration
        id: set-duration
        if: always()
        run: |
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          echo "duration=${duration}" >> "$GITHUB_OUTPUT"
