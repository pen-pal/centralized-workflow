name: Security Audit

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label for the cargo-deny job'
        required: false
        default: ubuntu-latest
        type: string

permissions:
  contents: read

jobs:
  cargo_audit:
    name: cargo audit + pants
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write # audit-check reports results as a check run
      issues: write # and opens issues on scheduled runs
    steps:
      - uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ github.token }}

      - name: Install cargo-pants
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-pants

      - name: Sonatype OSS Index check
        run: cargo pants

  cargo_deny_audit:
    name: cargo deny
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@76cd80eb775d7bbbd2d80292136d74d39e1b4918 # v2.0.14
        with:
          log-level: warn
          manifest-path: ./Cargo.toml
          command: check
          arguments: --all-features --locked
          command-arguments: ""
