name: Security Audit

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label for jobs that were self-hosted'
        required: false
        default: ubuntu-latest
        type: string

permissions:
  contents: read

jobs:
  cargo_audit:
    runs-on: ubuntu-latest # [self-hosted, linux, x64]
    permissions:
      contents: read
      checks: write # audit-check reports results as a check run
      issues: write # and opens issues on scheduled runs
    steps:
      - uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Cache Cargo registry and target
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            ~/.rustup/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ github.token }}

      - name: Remove Private Repo
        run: rm -f ~/.git-credentials

      - name: Handle build failure
        if: ${{ failure() }}
        run: echo "Build failed. Check logs for details."

  cargo_deny_audit:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@76cd80eb775d7bbbd2d80292136d74d39e1b4918 # v2.0.14
        with:
          log-level: warn
          manifest-path: ./Cargo.toml
          command: check
          arguments: --all-features --locked
          command-arguments: ""
          
      - name: Handle build failure
        if: ${{ failure() }}
        run: echo "Build failed. Check logs for details."
