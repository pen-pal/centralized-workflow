name: Test

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label for the Rust jobs'
        required: false
        default: ubuntu-latest
        type: string
      clippy_all_targets:
        description: 'Lint tests, benches and examples with all features too (default lints the library and binaries only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    name: cargo test
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      # Keyed on job, toolchain and lockfile; prunes stale build output before saving.
      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run Cargo Test
        run: cargo test --all-features --locked

  lint:
    name: cargo fmt + clippy
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Keyed on job, toolchain and lockfile; prunes stale build output before saving.
      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        env:
          ALL_TARGETS: ${{ inputs.clippy_all_targets }}
        run: |
          args=()
          if [ "$ALL_TARGETS" = true ]; then args=(--all-targets --all-features --locked); fi
          cargo clippy "${args[@]}" -- -D warnings

  deps:
    name: unused + outdated deps
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cargo-udeps only runs on nightly
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly

      - name: Install cargo-udeps and cargo-outdated
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-udeps,cargo-outdated

      # Keyed on job, toolchain and lockfile; prunes stale build output before saving.
      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Unused dependencies
        run: cargo udeps --locked

      # Report only: a new upstream release must not turn every pipeline red.
      - name: Outdated dependencies
        run: cargo outdated --root-deps-only
