name: IaC Scan

# Trivy misconfiguration scan of Dockerfiles, Terraform, Kubernetes manifests
# and Helm charts under a path.

on:
  workflow_call:
    inputs:
      path:
        description: 'Directory to scan'
        required: false
        default: '.'
        type: string
      fail_severity:
        description: 'Fail on misconfigurations of these severities. Empty disables the gate'
        required: false
        default: 'CRITICAL,HIGH'
        type: string
      skip_dirs:
        description: 'Comma-separated directories to skip'
        required: false
        default: ''
        type: string
      sarif:
        description: 'Upload all findings to code scanning (needs GitHub Advanced Security on private repos)'
        required: false
        default: true
        type: boolean

permissions: {}

jobs:
  trivy-config:
    name: trivy config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # SARIF upload, used only when sarif is true
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Report every severity to code scanning, then gate on the chosen ones below.
      - name: Trivy config (SARIF)
        if: inputs.sarif
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ inputs.path }}
          skip-dirs: ${{ inputs.skip_dirs }}
          format: sarif
          output: trivy-config.sarif
          exit-code: '0'

      - name: Upload SARIF
        if: inputs.sarif
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - name: Trivy config (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ inputs.path }}
          skip-dirs: ${{ inputs.skip_dirs }}
          format: table
          severity: ${{ inputs.fail_severity || 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL' }}
          exit-code: ${{ inputs.fail_severity != '' && '1' || '0' }}
          skip-setup-trivy: ${{ inputs.sarif }}
