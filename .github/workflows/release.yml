name: Move major tag

# Runs on this repo only: publishing release vX.Y.Z points the moving vX tag at it.

on:
  release:
    types: [published]

permissions: {}

jobs:
  move-major-tag:
    name: Point major tag at release
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Move tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::$TAG is not vX.Y.Z; major tag left alone"
            exit 0
          fi
          major="${TAG%%.*}"
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" -q .sha)
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$major" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major" -f sha="$sha" -F force=true > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$major" -f sha="$sha" > /dev/null
          fi
          echo "🏷️ $major -> $TAG ($sha)"
