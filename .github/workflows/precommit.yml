name: Precommit Check

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label for the precommit job'
        required: false
        default: ubuntu-latest
        type: string
    outputs:
      precommit_duration:
        description: 'Seconds taken by the precommit job'
        value: ${{ jobs.precommit.outputs.duration }}

permissions:
  contents: read

jobs:
  precommit:
    name: precommit check
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    outputs:
      duration: ${{ steps.set-duration.outputs.duration }}
    steps:
      - uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Start timer
        id: start-time
        run: echo "start_time=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-

      - name: Install nightly rustfmt and clippy
        run: rustup toolchain install nightly --profile minimal --component rustfmt,clippy

      - name: Install cargo-udeps
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-udeps

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.x

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit with color (console) and save plain output
        id: precommit
        run: |
          set -o pipefail
          pre-commit run --all-files --show-diff-on-failure | tee precommit_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Format pre-commit output for GitHub Summary
        if: always()
        run: |
          {
            echo '### 🧹 Pre-commit Summary'
            echo ''
            echo '```'
            cat precommit_output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if pre-commit failed
        if: steps.precommit.outputs.exit_code != '0'
        run: exit 1

      - name: End timer and calculate duration
        id: set-duration
        if: always()
        run: |
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          echo "duration=${duration}" >> "$GITHUB_OUTPUT"
