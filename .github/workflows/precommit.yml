name: Precommit Check

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label for the precommit job'
        required: false
        default: ubuntu-latest
        type: string
    outputs:
      precommit_duration:
        description: 'Seconds taken by the precommit job'
        value: ${{ jobs.precommit.outputs.duration }}

permissions:
  contents: read

jobs:
  precommit:
    name: precommit check
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    outputs:
      duration: ${{ steps.set-duration.outputs.duration }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Start timer
        id: start-time
        run: echo "start_time=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Keyed on job, toolchain and lockfile; prunes stale build output before saving.
      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install nightly rustfmt and clippy
        run: rustup toolchain install nightly --profile minimal --component rustfmt,clippy

      - name: Install cargo-udeps
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-udeps

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.x

      # ponytail: zipapp pinned by checksum; Dependabot cannot bump it, update by hand.
      - name: Install pre-commit
        env:
          VERSION: 4.7.0
          SHA256: 393488513aed286d7a5a978a1fe79b2f5a8802927242a2d241ff10c1a8e8c885
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/pre-commit.pyz" \
            "https://github.com/pre-commit/pre-commit/releases/download/v${VERSION}/pre-commit-${VERSION}.pyz"
          echo "${SHA256}  $RUNNER_TEMP/pre-commit.pyz" | sha256sum -c -
          printf '#!/bin/sh\nexec python3 "%s" "$@"\n' "$RUNNER_TEMP/pre-commit.pyz" > "$RUNNER_TEMP/bin/pre-commit"
          chmod +x "$RUNNER_TEMP/bin/pre-commit"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run pre-commit with color (console) and save plain output
        id: precommit
        run: |
          set -o pipefail
          pre-commit run --all-files --show-diff-on-failure | tee precommit_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Format pre-commit output for GitHub Summary
        if: always()
        run: |
          {
            echo '### 🧹 Pre-commit Summary'
            echo ''
            echo '```'
            cat precommit_output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if pre-commit failed
        if: steps.precommit.outputs.exit_code != '0'
        run: exit 1

      - name: End timer and calculate duration
        id: set-duration
        if: always()
        run: |
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          echo "duration=${duration}" >> "$GITHUB_OUTPUT"
