name: Precommit Check

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label for the precommit job'
        required: false
        default: ubuntu-latest
        type: string
    outputs:
      precommit_duration:
        description: 'Seconds taken by the precommit job'
        value: ${{ jobs.precommit.outputs.duration }}

permissions:
  contents: read

jobs:
  precommit:
    name: precommit check
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    outputs:
      duration: ${{ steps.set-duration.outputs.duration }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Start timer
        id: start-time
        run: echo "start_time=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-

      - name: Install nightly rustfmt and clippy
        run: rustup toolchain install nightly --profile minimal --component rustfmt,clippy

      - name: Install cargo-udeps
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-udeps

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.x

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit with color (console) and save plain output
        id: precommit
        run: |
          set -o pipefail
          pre-commit run --all-files --show-diff-on-failure | tee precommit_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Format pre-commit output for GitHub Summary
        if: always()
        run: |
          {
            echo '### 🧹 Pre-commit Summary'
            echo ''
            echo '```'
            cat precommit_output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if pre-commit failed
        if: steps.precommit.outputs.exit_code != '0'
        run: exit 1

      - name: End timer and calculate duration
        id: set-duration
        if: always()
        run: |
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          echo "duration=${duration}" >> "$GITHUB_OUTPUT"
