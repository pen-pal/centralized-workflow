name: Terraform

# Static checks for a Terraform root: fmt, validate (no backend, no cloud
# credentials) and tflint. Pair with iac-scan.yml for misconfigurations.

on:
  workflow_call:
    inputs:
      working_directory:
        description: 'Directory holding the Terraform root module'
        required: false
        default: '.'
        type: string
      terraform_version:
        description: 'Terraform version constraint, e.g. "~1.9"'
        required: false
        default: latest
        type: string
      tflint_version:
        description: 'tflint version, e.g. v0.55.0'
        required: false
        default: latest
        type: string

permissions: {}

jobs:
  checks:
    name: fmt + validate + tflint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform validate
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ inputs.tflint_version }}
          github_token: ${{ github.token }}

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # plugin downloads
        run: |
          tflint --init
          tflint --recursive --format compact
