name: CodeQL

on:
  workflow_call:
    inputs:
      languages:
        description: 'CodeQL languages (JSON array). "actions" analyses the workflow files themselves'
        required: false
        default: '["rust", "actions"]'
        type: string
      queries:
        description: 'Query suite: default, security-extended or security-and-quality'
        required: false
        default: security-extended
        type: string

permissions: {}

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # workflow run metadata on private repos
      security-events: write # results go to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # build-mode none: Rust and actions are analysed from source, no build step needed.
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: ${{ inputs.queries }}

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
