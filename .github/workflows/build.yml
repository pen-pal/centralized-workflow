name: Build Multi-Arch

on:
  workflow_call:
    inputs:
      sha:
        description: 'Image tag to publish, normally the commit SHA'
        required: true
        type: string
      branch_slug:
        description: 'Unused. Kept so existing callers that pass it do not break'
        required: false
        type: string
      repo_name:
        description: 'Image name under ghcr.io/<owner>/'
        required: true
        type: string
      dependency_clone:
        description: 'Unused. Kept so existing callers that pass it do not break'
        required: false
        default: false
        type: 'boolean'
      dependency_repo:
        description: 'Unused. Kept so existing callers that pass it do not break'
        required: false
        type: string
      dependency_ref:
        description: 'Unused. Kept so existing callers that pass it do not break'
        required: false
        type: string
      docker_targets:
        description: 'Dockerfile stages to build, as a JSON array. The first keeps plain tags, others get a -<target> suffix'
        required: false
        default: '["final"]'
        type: string
      build_args:
        description: "Extra docker build args, one KEY=VALUE per line"
        required: false
        default: ''
        type: string
      runner_amd64:
        description: "Runner label for amd64 builds"
        required: false
        default: ubuntu-latest
        type: string
      runner_arm64:
        description: "Runner label for arm64 builds"
        required: false
        default: ubuntu-24.04-arm
        type: string
    outputs:
      build_duration:
        description: 'Seconds taken by the last image build job to finish'
        value: ${{ jobs.build_arch.outputs.duration }}
    secrets:
      GH_ACTION_PAT:
        description: 'PAT for GHCR / private deps. Falls back to GITHUB_TOKEN'
        required: false
      GH_ACTION_ACTOR:
        description: 'User for GH_ACTION_PAT. Falls back to github.actor'
        required: false
      GH_ACTION_USER:
        description: 'Username passed to the build as secret github_username. Falls back to github.actor'
        required: false

permissions: {}

env:
  REPO: ${{ inputs.repo_name }}
  ORG: ${{ github.repository_owner }}
  SHA: ${{ inputs.sha }}
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.repo_name }}

jobs:
  determine_build_target:
    name: Determine Target
    runs-on: ubuntu-latest # Can be a fast, standard runner
    timeout-minutes: 5
    outputs:
      # Output is now based on which step successfully ran
      target_environment: ${{ steps.check_prod.outputs.environment || steps.check_public.outputs.environment || steps.check_fallback.outputs.environment }}
      
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Start timer
        id: start-time
        run: echo "start_time=$(date +%s)" >> "$GITHUB_ENV"

      - name: CHECK Production Tag (v*.*.*)
        id: check_prod
        if: |
          startsWith(github.ref, 'refs/tags/') &&
          startsWith(github.ref_name, 'v') &&
          !contains(github.ref_name, '-pub') &&
          !contains(github.ref_name, '-beta') &&
          !contains(github.ref_name, '-test') &&
          !contains(github.ref_name, '-dev') &&
          !contains(github.ref_name, '-rc')
        run: echo "environment=production" >> "$GITHUB_OUTPUT"

      - name: CHECK Public Tag (v*.*.*-pub or -beta)
        id: check_public
        if: |
          steps.check_prod.outcome != 'success' &&
          startsWith(github.ref, 'refs/tags/') &&
          (contains(github.ref_name, '-pub') || contains(github.ref_name, '-beta'))
        run: echo "environment=public" >> "$GITHUB_OUTPUT"

      - name: CHECK Fallback (branch or rejected tags)
        id: check_fallback
        if: |
          steps.check_prod.outcome != 'success' &&
          steps.check_public.outcome != 'success'
        run: echo "environment=staging" >> "$GITHUB_OUTPUT"

      - name: End timer and calculate duration
        id: set-duration
        if: always()
        run: |
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          echo "duration=${duration}" >> "$GITHUB_OUTPUT"

  build_arch:
    name: Build Image (${{ matrix.target }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment:
      name: ${{ needs.determine_build_target.outputs.target_environment }}
    needs: [determine_build_target]
    outputs:
      duration: ${{ steps.set-duration.outputs.duration }}
    strategy:
      matrix:
        arch: [amd64, arm64]
        target: ${{ fromJSON(inputs.docker_targets) }}
        include:
          - arch: amd64
            runner: ${{ inputs.runner_amd64 }}
            platform: linux/amd64
          - arch: arm64
            runner: ${{ inputs.runner_arm64 }}
            platform: linux/arm64

    permissions:
      contents: read
      packages: write

    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Start timer
        id: start-time
        run: echo "start_time=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GH_ACTION_ACTOR || github.actor }}
          password: ${{ secrets.GH_ACTION_PAT || github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push ${{ matrix.arch }} image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: ${{ matrix.platform }}
          target: ${{ matrix.target }}
          labels: ${{ steps.meta.outputs.labels }}
          # Always pushes (by digest, untagged), PRs included: the merge and scan jobs need the image.
          outputs: type=image,push-by-digest=true,name-canonical=true,name=${{ env.REGISTRY_IMAGE }},push=true
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch }}
          secrets: |
            github_token=${{ secrets.GH_ACTION_PAT || github.token }}
            github_username=${{ secrets.GH_ACTION_USER || github.actor }}
          build-args: |
            GITHUB_ORGANIZATION=${{ env.ORG }}
            ARCH=${{ matrix.arch }}
            ${{ inputs.build_args }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.target }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1 # only the merge job reads it
          compression-level: 0
          overwrite: true

      - name: End timer and calculate duration
        id: set-duration
        if: always()
        run: |
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          echo "duration=${duration}" >> "$GITHUB_OUTPUT"

  merge:
    name: Merge Manifest (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - build_arch
    strategy:
      fail-fast: false
      matrix:
        # One manifest list per target, so targets never share a tag.
        target: ${{ fromJSON(inputs.docker_targets) }}
    permissions:
      packages: write
      id-token: write # keyless signing
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.target }}-linux-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GH_ACTION_ACTOR || github.actor }}
          password: ${{ secrets.GH_ACTION_PAT || github.token }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=${{ env.SHA }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # First target keeps the plain tags; every other target gets a -<target> suffix.
          flavor: |
            ${{ matrix.target != fromJSON(inputs.docker_targets)[0] && format('suffix=-{0}', matrix.target) || '' }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tag_args < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          refs=()
          for d in *; do refs+=("${REGISTRY_IMAGE}@sha256:${d}"); done
          docker buildx imagetools create "${tag_args[@]}" "${refs[@]}"

      - name: Resolve manifest digest
        id: digest
        run: |
          # Sign and verify the immutable digest, never a tag that can be moved.
          tag=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -er .digest)
          echo "ref=${REGISTRY_IMAGE}@${digest}" >> "$GITHUB_OUTPUT"
          echo "📦 $tag -> $digest"

      - name: Sign the image
        env:
          IMAGE: ${{ steps.digest.outputs.ref }}
        run: |
          #🔑🔏 Keyless OIDC signature on the digest; it covers every tag pointing at it.
          cosign sign --yes "$IMAGE"

      - name: Verify Image Signature
        env:
          IMAGE: ${{ steps.digest.outputs.ref }}
          OIDC_ISSUER: "https://token.actions.githubusercontent.com"
        run: |
          # Signer identity = this reusable workflow at whatever ref the caller pinned.
          # Read it from our own OIDC token so renames, forks and pins need no edits.
          IDENTITY="https://github.com/$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sigstore" \
            | jq -er '.value | split(".")[1] | gsub("-";"+") | gsub("_";"/") | @base64d | fromjson | .job_workflow_ref')"

          echo "-------------------------------------------------------"
          echo "🔍 STARTING VERIFICATION"
          echo "📦 Image:    $IMAGE"
          echo "🆔 Match:    $IDENTITY"
          echo "-------------------------------------------------------"

          if cosign verify \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "$IMAGE"; then

            echo ""
            echo "✅✅ VERIFICATION SUCCESSFUL!"
            echo "The image was signed by this repository's OIDC identity."
            echo ""
            echo "╰┈➤📜 To verify manually, run:"
            echo "   cosign verify \\"
            echo "     --certificate-identity \"${IDENTITY}\" \\"
            echo "     --certificate-oidc-issuer \"${OIDC_ISSUER}\" \\"
            echo "     ${IMAGE}"

          else
            echo ""
            echo "🚨❌ VERIFICATION FAILED"
            echo "The signature does not match the expected identity."
            exit 1
          fi
